<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Offline · SJA Kisii</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }

    img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
    }

    h1 {
      font-weight: 300;
      font-size: 28px;
      margin: 24px 0 8px;
    }

    p {
      color: rgba(255, 255, 255, 0.6);
      max-width: 320px;
      line-height: 1.6;
      margin: 0 auto 24px;
    }

    button {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You are offline</h1>
    <p>Bravoo! Check your connection. The app needs the internet to load SJA features!.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>

</html>
